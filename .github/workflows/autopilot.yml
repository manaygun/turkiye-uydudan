name: Instagram autopilot

on:
  schedule:
    # 6 Reels a day, Turkey time (UTC+3): 08:00, 11:00, 13:30, 17:00, 20:00, 22:00
    - cron: "0 5 * * *"
    - cron: "0 8 * * *"
    - cron: "30 10 * * *"
    - cron: "0 14 * * *"
    - cron: "0 17 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "post = render and post, dry-run = render only, check = test the Instagram token"
        type: choice
        options: [post, dry-run, check]
        default: post

permissions:
  contents: write

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          sudo apt-get install -y -qq fonts-dejavu-core
          pip install -r requirements.txt

      - name: Render and post
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          case "${{ inputs.mode }}" in
            dry-run) python autopilot.py run --dry-run ;;
            check)   python autopilot.py check ;;
            *)       python autopilot.py run ;;
          esac

      - name: Save progress
        if: always()
        run: |
          git config user.name "autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "autopilot: update state" && git push)

      - name: Keep the Reel as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_id }}
          path: work/*/reel.mp4
          retention-days: 7
          if-no-files-found: ignore
