name: Instagram autopilot

on:
  schedule:
    # 4 Reels a day (UTC): 08:17, 13:17, 18:17, 23:17. Off the top of the hour, when GitHub's scheduler is busiest
    - cron: "17 8,13,18,23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "post = render and post, dry-run = render only, check = test the Instagram token"
        type: choice
        options: [post, dry-run, check]
        default: post

permissions:
  contents: write     # commit state.json
  pages: write        # host the Reel so Instagram can download it
  id-token: write

concurrency:
  group: autopilot
  cancel-in-progress: false

env:
  # scheduled runs have no inputs: they post
  MODE: ${{ inputs.mode || 'post' }}
  # explainers = animated English explainers; satellite = satellite timelapses
  CONTENT: explainers

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core fonts-noto-color-emoji espeak-ng
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache the voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1

      - name: Check Instagram token
        if: env.MODE != 'dry-run'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python autopilot.py check

      - name: Render
        if: env.MODE != 'check'
        run: python autopilot.py render ${{ env.MODE == 'dry-run' && '--dry-run' || '' }}

      - name: Stage the Reel for GitHub Pages
        if: env.MODE == 'post'
        run: |
          mkdir -p site
          cp work/pending/reel.mp4 "site/reel-${{ github.run_id }}.mp4"
          echo "@gecmistenharita" > site/index.html

      - uses: actions/configure-pages@v5
        if: env.MODE == 'post'

      - uses: actions/upload-pages-artifact@v3
        if: env.MODE == 'post'
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: pages
        if: env.MODE == 'post'
        uses: actions/deploy-pages@v4

      - name: Publish to Instagram
        if: env.MODE == 'post'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python autopilot.py publish --video-url "${{ steps.pages.outputs.page_url }}reel-${{ github.run_id }}.mp4"

      - name: Save progress
        if: always()
        run: |
          git config user.name "autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "autopilot: update state" && git pull --rebase && git push)

      - name: Keep the Reel as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_id }}
          path: work/*/reel.mp4
          retention-days: 7
          if-no-files-found: ignore
